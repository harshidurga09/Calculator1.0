
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="favicon.svg" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="calculator-top">
            <div class="brand">SMART CALCULATOR</div>
            <div class="display-container">
                <input type="text" id="display" value="0" readonly>
            </div>
        </div>

        <div class="buttons">
            <button class="pink-button special" data-action="clear">AC</button>
            <button class="pink-button special" data-action="delete">DEL</button>
            <button class="pink-button operator" data-value="%">%</button>
            <button class="pink-button operator" data-value="/">÷</button>

            <button class="pink-button" data-value="7">7</button>
            <button class="pink-button" data-value="8">8</button>
            <button class="pink-button" data-value="9">9</button>
            <button class="pink-button operator" data-value="*">×</button>

            <button class="pink-button" data-value="4">4</button>
            <button class="pink-button" data-value="5">5</button>
            <button class="pink-button" data-value="6">6</button>
            <button class="pink-button operator" data-value="-">−</button>

            <button class="pink-button" data-value="1">1</button>
            <button class="pink-button" data-value="2">2</button>
            <button class="pink-button" data-value="3">3</button>
            <button class="pink-button operator" data-value="+">+</button>

            <button class="pink-button zero" data-value="0">0</button>
            <button class="pink-button" data-value=".">.</button>
            <button class="pink-button equal" data-action="calculate">=</button>
        </div>

        <div class="footer-text">little calculations, big dreams ♡</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
